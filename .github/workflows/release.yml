name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Decode keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > warden-release.jks
          cat > keystore.properties <<EOF
          storeFile=warden-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - name: Build native (su shim + Zygisk module)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" -O2 sushim/su.c -o sushim/su-arm64
          ( cd module && "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk )
          mkdir -p build/magisk/zygisk build/magisk/warden dist
          cp module/module.prop module/customize.sh build/magisk/
          cp module/libs/arm64-v8a/libwarden.so build/magisk/zygisk/arm64-v8a.so
          cp sushim/su-arm64 build/magisk/warden/su
          ( cd build/magisk && zip -r -X ../../dist/warden-magisk-module.zip . )
          cp app/build/outputs/apk/release/app-release.apk dist/warden-release.apk || \
            cp app/build/outputs/apk/debug/app-debug.apk dist/warden-debug.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/warden-magisk-module.zip
